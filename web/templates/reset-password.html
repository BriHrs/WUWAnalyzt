<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Kata Sandi Baru — WUWAnalyzt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{ --accent:#2a41a4; --accent-h:#3a58e0; --positif:#16a37a; --negatif:#dc2626; --bg:#f7f7f5; --srf:#fff; --bdr:#e4e4e0; --bdr-f:var(--accent); --txt:#1a1a18; --txt2:#55554e; --txt3:#99998e; --r-md:10px; --r-xl:22px; --sh-sm:0 2px 8px rgba(0,0,0,.08); --sh-md:0 4px 16px rgba(0,0,0,.10); --fd:'DM Serif Display',Georgia,serif; --fb:'DM Sans',system-ui,sans-serif; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html{font-size:16px} body{font-family:var(--fb);background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;display:flex;flex-direction:column} a{color:var(--accent);text-decoration:none}
.nav{background:rgba(247,247,245,.93);border-bottom:1px solid var(--bdr);height:56px;display:flex;align-items:center;padding:0 28px} .nav-brand{font-family:var(--fd);font-size:22px;color:var(--txt)} .nav-brand span{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:var(--fb);transition:background .15s} .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-h)} .btn-full{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
.fg{margin-bottom:16px} .lbl{display:block;margin-bottom:5px;font-size:13px;font-weight:600;color:var(--txt2)} .inp{width:100%;padding:10px 13px;background:var(--srf);border:1px solid var(--bdr);border-radius:var(--r-md);font-family:var(--fb);font-size:14px;color:var(--txt);transition:border-color .2s;outline:none} .inp:focus{border-color:var(--bdr-f);box-shadow:0 0 0 3px rgba(79,110,247,.09)} .ferr{font-size:12px;color:var(--negatif);margin-top:4px;display:none} .ferr.show{display:block}
.login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; } .login-box { width: 100%; max-width: 420px; } .login-card { background: var(--srf); border: 1px solid var(--bdr); border-radius: var(--r-xl); padding: 36px 32px; box-shadow: var(--sh-sm); }
.login-title { font-family: var(--fd); font-size: 22px; margin-bottom: 4px; } .login-subtitle { font-size: 13px; color: var(--txt2); margin-bottom: 28px; line-height: 1.5; }
.input-wrap { position: relative; } .input-wrap .inp { padding-right: 42px; } .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--txt3); font-size: 15px; cursor: pointer; }
#tc{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px} .toast{padding:11px 16px;border-radius:var(--r-md);font-size:14px;font-weight:500;background:var(--txt);color:#fff;box-shadow:var(--sh-md);animation:tIn .3s ease;} .toast.success{background:var(--positif)}.toast.error{background:var(--negatif)} @keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}} .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite} @keyframes rot{to{transform:rotate(360deg)}} .fade{animation:fadeUp .4s ease both} @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav class="nav"><a class="nav-brand" href="index.html">WU<span>WA</span>nalyzt</a></nav>

<div class="login-wrapper fade">
  <div class="login-box">
    <div class="login-card">
      <h1 class="login-title">Buat Kata Sandi Baru</h1>
      <p class="login-subtitle">Silakan masukkan kata sandi baru untuk akun kamu.</p>
      <form id="resetForm" novalidate>
        <div class="fg">
          <label class="lbl" for="password">Kata Sandi Baru</label>
          <div class="input-wrap">
            <input class="inp" type="password" id="password" placeholder="Minimal 6 karakter" required>
            <button type="button" class="pw-toggle" id="pwToggle1">👁</button>
          </div>
          <div class="ferr" id="pwError">Kata sandi minimal 6 karakter.</div>
        </div>
        <div class="fg">
          <label class="lbl" for="confirmPassword">Konfirmasi Kata Sandi Baru</label>
          <div class="input-wrap">
            <input class="inp" type="password" id="confirmPassword" placeholder="Ulangi kata sandi" required>
            <button type="button" class="pw-toggle" id="pwToggle2">👁</button>
          </div>
          <div class="ferr" id="confirmError">Kata sandi tidak cocok.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="saveBtn">Simpan Kata Sandi Baru</button>
      </form>
    </div>
  </div>
</div>

<div id="tc"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://kcstgzapzzwdlcilfxau.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtjc3RnemFwenp3ZGxjaWxmeGF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNTc5NTEsImV4cCI6MjA5MTczMzk1MX0.oqkpZaiXgyJ4ImQ1tuTYohvXCIAzizfMAljJhhhZy-A';
const sb = supabase.createClient(SB_URL, SB_ANON);

function showToast(msg, type='', dur=3000) { let tc=document.getElementById('tc'); const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; tc.appendChild(t); setTimeout(()=>t.remove(), dur); }

// Fitur mata untuk melihat password
document.getElementById('pwToggle1').addEventListener('click', (e) => { const i = document.getElementById('password'); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.target.textContent = s ? '🙈' : '👁'; });
document.getElementById('pwToggle2').addEventListener('click', (e) => { const i = document.getElementById('confirmPassword'); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.target.textContent = s ? '🙈' : '👁'; });

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.querySelectorAll('.ferr').forEach(el => el.classList.remove('show'));

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  let valid = true;

  if (password.length < 6) { document.getElementById('pwError').classList.add('show'); valid = false; }
  if (password !== confirm) { document.getElementById('confirmError').classList.add('show'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Menyimpan...';

  try {
    // Supabase otomatis mengenali sesi reset dari URL (kode hash di email)
    const { error } = await sb.auth.updateUser({ password: password });
    if (error) throw error;
    
    showToast('Kata sandi berhasil diperbarui! Mengalihkan...', 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  } catch (error) {
    showToast(error.message || 'Gagal mengubah kata sandi. Tautan mungkin kadaluarsa.', 'error', 5000);
    btn.disabled = false; btn.textContent = 'Simpan Kata Sandi Baru';
  }
});
</script>
</body>
</html>
